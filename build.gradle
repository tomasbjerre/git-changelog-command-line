plugins {
	id "se.bjurr.gradle.bundle-command-shadow" version "2.1.1"
}

dependencies {
	implementation "se.bjurr.gitchangelog:git-changelog-lib:3.0.0"
	implementation "info.picocli:picocli:4.7.7"
	implementation "org.slf4j:slf4j-simple:2.0.19"
	implementation "tools.jackson.core:jackson-databind:3.2.2"
	implementation "org.openjdk.nashorn:nashorn-core:15.7"
}

javaExtension {
	javaVersion = 17
}

shadowJar {
	exclude 'META-INF/versions/21/**'
}

shadowExtension {
	mainClass.set("se.bjurr.gitchangelog.main.Main")
	relocate.set("org:org,com:com")
}

if (System.getenv("CI")) {
	// A literal env var name containing a dot ("signing.password") does not
	// survive the GitHub Actions -> bash -> JVM chain, so use a dot-free name
	// in CI only. Local releases keep using "signing.password" via gradle.properties.
	signExtension {
		signingPasswordEnvOrProp.set("SIGNING_PASSWORD")
	}
}

staticCodeAnalysisExtension {
	maxViolations.set(0)
}
